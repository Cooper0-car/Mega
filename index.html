<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>메가MGC커피 레시피 암기 퀴즈</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#15181c;--muted:#69707a;--line:#e5e8ec;--good:#0f8a4b;--bad:#c93434}
*{box-sizing:border-box}
body{margin:0;-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text)}
header{background:#111827;color:#fff;padding:20px 16px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.wrap{max-width:1100px;margin:0 auto}
h1{margin:0 0 6px;font-size:24px}.sub{color:#c9ced6;font-size:13px}
.tabs{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.tab{border:0;border-radius:999px;padding:9px 14px;background:#263041;color:#dce3ed;font-weight:800;cursor:pointer}.tab.on{background:#fff;color:#111827}
main{max-width:1100px;margin:20px auto;padding:0 14px 48px}.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 6px 20px rgba(15,23,42,.04);margin-bottom:14px}
.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;font-weight:800}
select,input[type=text]{width:100%;border:1px solid #d8dde4;border-radius:11px;padding:11px 12px;background:#fff}
.btn{border:0;border-radius:11px;padding:11px 15px;cursor:pointer;font-weight:900}.dark{background:#111827;color:#fff}.light{background:#eef1f5;color:#222}.good{background:#e8f7ef;color:var(--good)}.bad{background:#fdeaea;color:var(--bad)}
.statbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.pill{background:#eef1f5;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}
.progress{height:9px;background:#edf0f3;border-radius:99px;overflow:hidden;margin:10px 0 18px}.progress>div{height:100%;width:0;background:#111827;transition:width .25s}
.qtype{font-size:12px;color:var(--muted);font-weight:900;margin-bottom:7px}.question{font-size:22px;font-weight:950;line-height:1.4;margin:8px 0 16px}
.clue{background:#f7f8fa;border:1px dashed #d9dee5;border-radius:14px;padding:13px;margin:10px 0 16px;line-height:1.55}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{text-align:left;border:1px solid #dfe3e8;background:#fff;border-radius:13px;padding:13px;cursor:pointer;min-height:52px;font-weight:800}.opt:hover{background:#fafbfc}.opt.correct{border-color:#43a36c;background:#ecfaf2;color:#11683b}.opt.wrong{border-color:#db5c5c;background:#fff0f0;color:#9e2727}
.explain{margin-top:14px;padding:13px;border-radius:13px;background:#f7f8fa;display:none;line-height:1.65}
.center{text-align:center}.bigscore{font-size:46px;font-weight:950}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mini{padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff}.menu-title{font-size:18px;font-weight:950}.tag{font-size:11px;background:#eef1f5;padding:5px 8px;border-radius:999px;display:inline-block;margin:2px 3px 2px 0}
.recipe{display:grid;grid-template-columns:110px 1fr;gap:7px 10px;font-size:13px;line-height:1.5}.recipe b{color:#5c6470}.small{font-size:12px;color:var(--muted)}
.notice{font-size:12px;line-height:1.5;color:#5d6470}.flash{min-height:290px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.flash-name{font-size:30px;font-weight:950;margin:10px 0}.flash-answer{display:none;width:100%;margin-top:16px;text-align:left}.flash-answer.on{display:block}.flash-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:900px;background:#fff}th,td{padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:top;font-size:12px;text-align:left}th{background:#f7f8fa;position:sticky;top:0;z-index:1}
/* Tablet */
@media(max-width:800px){
  header{padding:18px 14px 14px}
  main{margin-top:14px}
  .controls{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:1fr 1fr}
  .question{font-size:21px}
}

/* Phone */
@media(max-width:560px){
  body{font-size:14px;overflow-x:hidden}
  header{position:sticky;top:0;padding:14px 12px 11px}
  h1{font-size:19px;line-height:1.25;margin-bottom:4px}
  .sub{font-size:11px;line-height:1.4}
  .tabs{gap:6px;margin-top:10px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:8px 12px;font-size:12px}

  main{margin:10px auto;padding:0 10px 28px}
  .card{border-radius:15px;padding:14px;margin-bottom:10px}
  .controls,.options,.grid{grid-template-columns:1fr}
  .controls{gap:8px}
  label{font-size:11px;margin-bottom:5px}
  select,input[type=text],.btn{min-height:44px}
  .btn{padding:10px 13px}

  .statbar{gap:8px;margin-bottom:10px}
  .pill{font-size:11px;padding:6px 8px}
  .progress{height:7px;margin:8px 0 14px}
  .qtype{font-size:11px;margin-bottom:5px}
  .question{font-size:19px;line-height:1.45;margin:7px 0 12px;word-break:keep-all}
  .clue{font-size:13px;padding:11px;margin:8px 0 12px;word-break:keep-all}
  .options{gap:8px}
  .opt{min-height:48px;padding:12px;font-size:14px;line-height:1.4;word-break:keep-all}
  .explain{font-size:13px;padding:11px;word-break:keep-all}

  .flash{min-height:260px;padding:16px 12px}
  .flash-name{font-size:24px;line-height:1.3;word-break:keep-all}
  .flash-answer{font-size:13px}
  .recipe{grid-template-columns:78px 1fr;gap:7px 8px}
  .flash-actions{width:100%;gap:8px}
  .flash-actions .btn{flex:1;min-width:0}

  /* Mobile recipe search becomes stacked cards instead of a wide table. */
  .tablewrap{border:0;overflow:visible}
  table{display:block;width:100%;min-width:0;background:transparent}
  table thead{display:none}
  table tbody{display:grid;gap:10px}
  table tr{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0;
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 4px 14px rgba(15,23,42,.04);
  }
  table td{
    display:block;
    min-width:0;
    padding:10px 11px;
    border-bottom:1px solid var(--line);
    font-size:12px;
    line-height:1.45;
    word-break:keep-all;
    overflow-wrap:anywhere;
  }
  table td:nth-child(1){grid-column:1;grid-row:1;border-bottom:0;background:#f7f8fa;font-weight:900}
  table td:nth-child(2){grid-column:2;grid-row:1;border-bottom:0;background:#f7f8fa;text-align:right}
  table td:nth-child(3){grid-column:1 / -1;grid-row:2;font-size:16px;font-weight:900}
  table td:nth-child(4){grid-column:1 / -1;grid-row:3}
  table td:nth-child(5){grid-column:1 / -1;grid-row:4}
  table td:nth-child(6){grid-column:1;grid-row:5}
  table td:nth-child(7){grid-column:2;grid-row:5}
  table td:nth-child(8){grid-column:1;grid-row:6}
  table td:nth-child(9){grid-column:2;grid-row:6}
  table td:nth-child(10){grid-column:1 / -1;grid-row:7}
  table td:nth-child(11){grid-column:1 / -1;grid-row:8}
  table td:nth-child(12){grid-column:1 / -1;grid-row:9;border-bottom:0}

  table td:nth-child(4)::before{content:"가격";display:block;color:var(--muted);font-size:10px;font-weight:900;margin-bottom:2px}
  table td:nth-child(5)::before{content:"제조순서";display:block;color:var(--muted);font-size:10px;font-weight:900;margin-bottom:2px}
  table td:nth-child(6)::before{content:"블랜더";display:block;color:var(--muted);font-size:10px;font-weight:900;margin-bottom:2px}
  table td:nth-child(7)::before{content:"컵";display:block;color:var(--muted);font-size:10px;font-weight:900;margin-bottom:2px}
  table td:nth-child(8)::before{content:"샷";display:block;color:var(--muted);font-size:10px;font-weight:900;margin-bottom:2px}
  table td:nth-child(9)::before{content:"얼음";display:block;color:var(--muted);font-size:10px;font-weight:900;margin-bottom:2px}
  table td:nth-child(10)::before{content:"액상";display:block;color:var(--muted);font-size:10px;font-weight:900;margin-bottom:2px}
  table td:nth-child(11)::before{content:"재료";display:block;color:var(--muted);font-size:10px;font-weight:900;margin-bottom:2px}
  table td:nth-child(12)::before{content:"토핑";display:block;color:var(--muted);font-size:10px;font-weight:900;margin-bottom:2px}

  .notice{font-size:11px}
  .mini{padding:12px}
  .menu-title{font-size:16px}
}
</style>
</head>
<body>
<header><div class="wrap">
<h1>메가MGC커피 레시피 암기 퀴즈</h1>
<div class="sub">원본 레시피 표 116개 음료 기준 · 브라우저에서 바로 실행</div>
<div class="tabs">
<button class="tab on" data-tab="quiz">퀴즈</button>
<button class="tab" data-tab="flash">암기카드</button>
<button class="tab" data-tab="list">레시피 검색</button>
<button class="tab" data-tab="base">베이스·펄</button>
</div></div></header>

<main>
<section id="quiz" class="panel on">
<div class="card">
<div class="controls">
<div><label>범위</label><select id="catSel"></select></div>
<div><label>문제 수</label><select id="countSel"><option value="10">10문제</option><option value="20" selected>20문제</option><option value="30">30문제</option><option value="all">전체</option></select></div>
<div><label>문제 유형</label><select id="typeSel"><option value="mix">랜덤 혼합</option><option value="menuToInfo">메뉴 → 정보</option><option value="infoToMenu">정보 → 메뉴</option><option value="price">가격</option></select></div>
<div style="display:flex;align-items:end"><button class="btn dark" id="startBtn" style="width:100%">퀴즈 시작</button></div>
</div>
<div class="notice" style="margin-top:12px">원본 표에서 제조순서가 병합 셀로 비어 있는 항목은 제조순서 문제에서 제외합니다.</div>
</div>

<div id="quizCard" class="card" style="display:none">
<div class="statbar"><div><span class="pill" id="qNo">1 / 20</span> <span class="pill" id="liveScore">점수 0</span> <span class="pill" id="streak">연속 0</span></div><button class="btn light" id="stopBtn">퀴즈 종료</button></div>
<div class="progress"><div id="bar"></div></div>
<div class="qtype" id="qType"></div><div class="question" id="question"></div><div class="clue" id="clue"></div>
<div class="options" id="options"></div><div class="explain" id="explain"></div>
<div style="margin-top:14px;text-align:right"><button class="btn dark" id="nextBtn" style="display:none">다음 문제</button></div>
</div>

<div id="resultCard" class="card center" style="display:none">
<div class="small">이번 퀴즈 결과</div><div class="bigscore" id="finalScore">0%</div><div id="finalDetail" style="font-weight:900;margin:8px 0 18px"></div>
<button class="btn dark" id="retryBtn">같은 범위로 다시 풀기</button> <button class="btn light" id="wrongTabBtn">레시피 검색으로 보기</button>
<div id="wrongBox" style="text-align:left;margin-top:18px"></div>
</div>
</section>

<section id="flash" class="panel">
<div class="card"><div class="controls">
<div><label>카테고리</label><select id="flashCat"></select></div>
<div><label>메뉴 선택</label><select id="flashMenu"></select></div>
<div style="display:flex;align-items:end"><button class="btn dark" id="randomFlash" style="width:100%">랜덤 카드</button></div>
<div style="display:flex;align-items:end"><button class="btn light" id="shuffleFlash" style="width:100%">다음 카드</button></div>
</div></div>
<div class="card flash">
<div class="small" id="flashCatName"></div><div class="flash-name" id="flashName">메뉴를 선택하세요</div>
<button class="btn dark" id="revealBtn">레시피 보기</button><div class="flash-answer" id="flashAnswer"></div>
<div class="flash-actions"><button class="btn bad" id="knowNo">❌ 아직 헷갈림</button><button class="btn good" id="knowYes">✅ 외움</button></div>
</div></section>

<section id="list" class="panel">
<div class="card"><input id="search" type="text" placeholder="메뉴명, 재료, 시럽, 용량으로 검색"><div class="small" id="listCount" style="margin-top:8px"></div></div>
<div class="tablewrap"><table><thead><tr><th>#</th><th>카테고리</th><th>제품명</th><th>가격</th><th>제조순서</th><th>블랜더</th><th>컵</th><th>샷</th><th>얼음</th><th>액상</th><th>재료</th><th>토핑</th></tr></thead><tbody id="listBody"></tbody></table></div>
</section>

<section id="base" class="panel">
<div class="card"><h2 style="margin-top:0">베이스·펄 암기</h2><div class="grid" id="baseGrid"></div></div>
<div class="card"><h2 style="margin-top:0">펌프 / 래들 핵심</h2><div id="noteBox"></div></div>
</section>
</main>

<script>

const notes = ["헛개베이스: 2ml(3.4g)", "카파/포모나 7ml: 카라멜시럽 10g / 바닐라시럽 10g / 헤이즐넛시럽 10g / 슈가시럽 10g / 라이트바닐라시럽 8g", "셀플러스/스포트 10ml: 자몽시럽 12.5g / 라임시럽 12.5g / 블루큐라소시럽 12.5g / 민트시럽 12.5g", "1oz(30ml): 딸기소스 37g / 골드망고베이스 34.5g / 레몬퓨레 36g / 자몽퓨레 37g / 청포도퓨레 38.5g / 부스터베이스 36g / 메가에이드베이스 37g", "0.5oz(15ml): 흑당베이스 23.5g", "래들: 양구계량스푼 / 청래들: 롱계량스푼"];

const fields=[["price","가격"],["process","제조순서"],["blender","블랜더"],["cup","컵"],["shots","샷"],["ice","얼음"],["liquid","액상(텀블러)"],["ingredient","재료"],["topping","토핑"]];
const cats=[...new Set(data.map(x=>x.category))];

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function norm(v){if(v===null||v===undefined||v==="")return"표기 없음";if(v==="x")return"없음 (x)";return v}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fill(el,vals){el.innerHTML=vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("")}

fill(document.getElementById("catSel"),["전체",...cats]);fill(document.getElementById("flashCat"),["전체",...cats]);

document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("on"));b.classList.add("on");document.getElementById(b.dataset.tab).classList.add("on");if(b.dataset.tab==="list")renderList();if(b.dataset.tab==="flash")refreshFlashMenus()}));

let quiz={pool:[],questions:[],idx:0,score:0,correct:0,wrong:[],streak:0};

function pool(){const c=document.getElementById("catSel").value;return c==="전체"?data:data.filter(x=>x.category===c)}
function values(pool,field,correct){return [...new Set(pool.map(x=>norm(x[field])).filter(v=>v!==correct))]}
function opts(correct,pool,field){return shuffle([correct,...shuffle(values(pool,field,correct)).slice(0,3)]).slice(0,4)}
function chooseField(item){const usable=fields.filter(([k])=>item[k]!==""&&item[k]!==null&&item[k]!==undefined);const nonx=usable.filter(([k])=>item[k]&&item[k]!=="x");return (nonx.length?nonx:usable)[Math.floor(Math.random()*(nonx.length?nonx:usable).length)]}

function makeQ(item,forced,p){
  let type=forced;if(type==="mix")type=Math.random()<.5?"menuToInfo":(Math.random()<.55?"infoToMenu":"price");
  if(type==="price"){const c=norm(item.price);const o=opts(c,p,"price");return{label:"메뉴 → 가격",q:`[${item.id}] ${item.name}의 가격은?`,clue:`카테고리: ${item.category}`,o,corr:o.indexOf(c),ans:c,item}}
  if(type==="menuToInfo"){
    let [k,n]=chooseField(item);if(k==="process"&&!item.process)[k,n]=["ingredient","재료"];
    const c=norm(item[k]),o=opts(c,p,k);return{label:`메뉴 → ${n}`,q:`[${item.id}] ${item.name}의 ${n}은(는)?`,clue:`카테고리: ${item.category}`,o,corr:o.indexOf(c),ans:c,item}
  }
  const clue=[["ingredient","재료"],["liquid","액상"],["topping","토핑"],["cup","컵"],["shots","샷"]].filter(([k])=>item[k]&&item[k]!=="x");
  const [k,n]=clue[Math.floor(Math.random()*clue.length)]||["price","가격"];
  const picked=shuffle([item,...shuffle(p.filter(x=>x.id!==item.id)).slice(0,3)]);
  const o=picked.map(x=>`[${x.id}] ${x.name}`);return{label:`${n} → 메뉴`,q:`다음 ${n}이(가) 사용되는 메뉴는?`,clue:`${n}: ${norm(item[k])}`,o,corr:o.findIndex(v=>v.startsWith(`[${item.id}]`)),ans:`[${item.id}] ${item.name}`,item}
}
function start(){
  quiz.pool=pool();let n=document.getElementById("countSel").value;n=n==="all"?quiz.pool.length:Math.min(+n,quiz.pool.length);
  const picked=shuffle(quiz.pool).slice(0,n),forced=document.getElementById("typeSel").value;
  quiz.questions=picked.map(x=>makeQ(x,forced,quiz.pool));quiz.idx=0;quiz.score=0;quiz.correct=0;quiz.wrong=[];quiz.streak=0;
  document.getElementById("quizCard").style.display="block";document.getElementById("resultCard").style.display="none";renderQ()
}
function renderQ(){
  const q=quiz.questions[quiz.idx];document.getElementById("qNo").textContent=`${quiz.idx+1} / ${quiz.questions.length}`;document.getElementById("liveScore").textContent=`점수 ${quiz.score}`;document.getElementById("streak").textContent=`연속 ${quiz.streak}`;document.getElementById("bar").style.width=`${quiz.idx/quiz.questions.length*100}%`;
  document.getElementById("qType").textContent=q.label;document.getElementById("question").textContent=q.q;document.getElementById("clue").textContent=q.clue;document.getElementById("explain").style.display="none";document.getElementById("nextBtn").style.display="none";
  const w=document.getElementById("options");w.innerHTML="";q.o.forEach((t,i)=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>answer(i);w.appendChild(b)})
}
function answer(i){
  const q=quiz.questions[quiz.idx],bs=[...document.querySelectorAll(".opt")];bs.forEach(b=>b.disabled=true);bs[q.corr].classList.add("correct");
  if(i===q.corr){quiz.correct++;quiz.score+=10+quiz.streak*2;quiz.streak++;document.getElementById("explain").innerHTML=`<b>정답!</b><br>정답: ${esc(q.ans)}`}
  else{bs[i].classList.add("wrong");quiz.wrong.push(q.item);quiz.streak=0;document.getElementById("explain").innerHTML=`<b style="color:#c93434">오답</b><br>정답: <b>${esc(q.ans)}</b><br><span class="small">[${q.item.id}] ${esc(q.item.name)} · ${esc(q.item.category)}</span>`}
  document.getElementById("liveScore").textContent=`점수 ${quiz.score}`;document.getElementById("streak").textContent=`연속 ${quiz.streak}`;document.getElementById("explain").style.display="block";document.getElementById("nextBtn").style.display="inline-block"
}
function finish(){
  const pct=quiz.questions.length?Math.round(quiz.correct/quiz.questions.length*100):0;document.getElementById("finalScore").textContent=`${pct}%`;document.getElementById("finalDetail").textContent=`${quiz.correct} / ${quiz.questions.length} 정답 · 점수 ${quiz.score}`;document.getElementById("quizCard").style.display="none";document.getElementById("resultCard").style.display="block";
  const seen=new Set(),u=quiz.wrong.filter(x=>!seen.has(x.id)&&(seen.add(x.id),true));document.getElementById("wrongBox").innerHTML=u.length?`<div class="small" style="margin-bottom:8px">틀린 메뉴 ${u.length}개</div><div class="grid">${u.map(x=>`<div class="mini"><div class="menu-title">[${x.id}] ${esc(x.name)}</div><div class="tag">${esc(x.category)}</div><div class="small">${esc(norm(x.ingredient))}</div></div>`).join("")}</div>`:`<div class="mini"><b>틀린 문제가 없어요.</b></div>`
}
document.getElementById("startBtn").onclick=start;document.getElementById("retryBtn").onclick=start;document.getElementById("stopBtn").onclick=finish;document.getElementById("nextBtn").onclick=()=>{quiz.idx++;quiz.idx>=quiz.questions.length?finish():renderQ()};document.getElementById("wrongTabBtn").onclick=()=>document.querySelector('[data-tab="list"]').click();

function refreshFlashMenus(){

 sel.innerHTML=p.map(x=>`<option value="${x.id}">[${x.id}] ${esc(x.name)}</option>`).join("");showFlash(p[0]||data[0])
}

 if(!x)return;document.getElementById("flashCatName").textContent=`${x.category} · 원본 PDF ${x.page}페이지`;document.getElementById("flashName").textContent=`[${x.id}] ${x.name}`;

document.getElementById("randomFlash").onclick=()=>{const c=document.getElementById("flashCat").value,p=c==="전체"?data:data.filter(x=>x.category===c);showFlash(p[Math.floor(Math.random()*p.length)])};

function renderList(){
 const q=(document.getElementById("search").value||"").trim().toLowerCase(),p=data.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));document.getElementById("listCount").textContent=`${p.length}개 메뉴`;

document.getElementById("baseGrid").innerHTML=baseData.map(x=>`<div class="mini"><div class="menu-title">${esc(x.name)}</div><div style="margin-top:8px"><b>레시피</b><br>${esc(x.recipe)}</div><div style="margin-top:8px"><b>보관용기</b>: ${esc(x.container)}</div><div style="margin-top:4px"><b>보관</b>: ${esc(x.storage)}</div></div>`).join("");
